name: Test

on:
  push:
    branches-ignore:
      - main

jobs:
  check_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Builds the library, packs it, loads it with require() and import, and
      # type-checks it under node16, nodenext, and bundler
      - name: Check package
        run: npm run check:package
